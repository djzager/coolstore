schemaVersion: 2.2.0
metadata:
  name: coolstore
components:
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi8-latest
      memoryLimit: 6Gi
      memoryRequest: 2Gi
      cpuLimit: "2"
      cpuRequest: 200m
commands:
  - id: install-extensions
    exec:
      commandLine: |
        for f in ${PROJECT_SOURCE}/.extensions/*.vsix; do
          [ -f "$f" ] && code --install-extension "$f" --force
        done
      component: tools
events:
  postStart:
    - install-extensions
